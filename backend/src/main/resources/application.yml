server:
  port: 8089

spring:
  application:
    name: cuahangtienloi

  #  security:
  #    user:
  #      name: admin
  #      password: admin

  config:
    import: optional:file:.env[.properties], optional:file:backend/.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuahangtienloi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 30000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT phải nằm ngoài spring:
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# CORS cũng phải nằm ngoài spring:
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

#  liquibase:
#    change-log: classpath:db/changelog/db.changelog-master.yaml
#    enabled: false

app:
  storage:
    contract-dir: ${CONTRACT_STORAGE:uploads/hop-dong}

logging:
  level:
    root: INFO
    com.erp.cuahangtienloi: INFO
    org.hibernate.SQL: ERROR